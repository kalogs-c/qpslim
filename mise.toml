min_version = "2026.4.0"

[tools]
zig = "0.16.0"

[tasks.build]
description = "Build dx11-test (x86_64-windows-gnu) via zig build"
dir = "native"
run = "zig build"

[tasks.release]
description = "Optimized build for real measurement (-Doptimize=ReleaseFast)"
dir = "native"
run = "zig build -Doptimize=ReleaseFast"

[tasks.test]
description = "Run stats unit tests on the host"
dir = "native"
run = "zig build test"

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf native/zig-out native/zig-cache build"
