min_version = "2026.4.0"

[tools]
node = "lts"
python = "3.14.7"
rust = "1.94.0"
zig = "0.16.0"

[tasks.build]
description = "Build dx11-test (x86_64-windows-gnu) via zig build"
dir = "native"
run = "zig build"

[tasks.release]
description = "Optimized build for real measurement (-Doptimize=ReleaseFast)"
dir = "native"
run = "zig build -Doptimize=ReleaseFast"

[tasks.test]
description = "Run host unit tests"
dir = "native"
run = "zig build test --summary all"

[tasks.check]
description = "Check PE artifacts (MZ, x86-64, subsystem, exports)"
run = "python3 tools/check-pe.py"

[tasks.core-test]
description = "Run Rust core unit tests"
run = "cargo test -p qpslim-core"
dir = "core"

[tasks.app-test]
description = "Run Tauri frontend unit tests (vitest)"
run = "npm run test"
dir = "app"

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf native/zig-out native/zig-cache build"
